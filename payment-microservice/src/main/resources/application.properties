# Application
spring.application.name=payment-microservice
server.port=8081

# H2 Database Configuration (Development)
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Payment simulation: deterministic=true makes live demos predictable.
# Set to false for realistic 70/30 random outcomes.
payment.simulation.deterministic=true
# Step-up authorization: card charges >= this amount (LKR) are held on the first
# attempt (bank auth hold) and clear on retry. Drives the resilience demo purely
# from the order total - a big-ticket purchase, no IDs or magic names.
payment.simulation.step-up-threshold=1500000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.example.payment=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
