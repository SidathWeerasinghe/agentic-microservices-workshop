# Application
spring.application.name=orchestrator-microservice
server.port=8083

# Service URLs
services.inventory.url=http://localhost:8080
services.payment.url=http://localhost:8081
services.shipping.url=http://localhost:8082

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.example.orchestrator=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.reactive.function.client=DEBUG

# WebClient timeout settings
spring.webflux.client.connect-timeout=5000
spring.webflux.client.read-timeout=10000
